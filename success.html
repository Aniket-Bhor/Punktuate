<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Punktuate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000B3D; color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .luxury-caption { letter-spacing: 0.4em; text-transform: uppercase; font-weight: 600; font-size: 10px; }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .border-gold { border-color: #D4AF37; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-6 py-20">
    <div class="max-w-4xl w-full text-center">
        <div class="mb-12 inline-block">
            <div class="w-32 h-32 bg-[#D4AF37]/10 rounded-full flex items-center justify-center border border-[#D4AF37]/30 animate-pulse">
                <i data-lucide="party-popper" class="w-16 h-16 text-gold"></i>
            </div>
        </div>
        
        <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-6 lowercase">Booking <span class="text-gold">Confirmed!</span></h1>
        <p class="text-xl text-white/50 mb-16 max-w-2xl mx-auto leading-tight">Your tickets for The Phoolish Concert by Apurva Bondre have been secured. Welcome to the experience, <span id="cust-name" class="text-white">Guest</span>.</p>
        
        <div class="glass p-12 rounded-[50px] border border-white/10 mb-20 relative overflow-hidden text-left">
            <div class="absolute top-0 right-0 p-8 opacity-10">
                <img src="17-removebg-preview.png" alt="Punktuate" class="h-12 w-auto">
            </div>
            
            <div class="grid md:grid-cols-2 gap-12">
                <div class="space-y-8">
                    <div>
                        <p class="luxury-caption text-gold mb-2">Order ID</p>
                        <p id="order-id" class="text-2xl font-bold tracking-tight">---</p>
                    </div>
                    <div>
                        <p class="luxury-caption text-gold mb-2">Ticket Type</p>
                        <p id="ticket-info" class="text-2xl font-bold tracking-tight uppercase">---</p>
                    </div>
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <p class="luxury-caption text-gold mb-2">Date</p>
                            <p class="text-xl font-bold">13 June 2026</p>
                        </div>
                        <div>
                            <p class="luxury-caption text-gold mb-2">Time</p>
                            <p class="text-xl font-bold">6:30 PM</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col items-center justify-center bg-white/5 rounded-[40px] p-8 border border-white/5">
                    <p class="luxury-caption text-gold mb-6">Digital Pass</p>
                    <div class="bg-white p-4 rounded-3xl mb-6">
                        <!-- Placeholder QR Code -->
                        <img id="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PunktuateBooking" alt="Ticket QR" class="w-40 h-40">
                    </div>
                    <p class="text-[10px] luxury-caption text-white/30">Scan at Entrance</p>
                </div>
            </div>
            
            <div class="mt-12 pt-12 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <p class="luxury-caption text-gold mb-2">Venue</p>
                    <p class="text-lg font-medium">Royal Opera House, Mumbai</p>
                </div>
                <div class="text-right">
                    <p class="luxury-caption text-gold mb-2">Payment ID</p>
                    <p id="payment-id" class="text-sm font-mono text-white/40">---</p>
                </div>
            </div>
        </div>
        
        <a href="index.html" class="inline-flex items-center gap-3 text-gold luxury-caption hover:text-white transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Return to Home
        </a>
    </div>

    <script>
        lucide.createIcons();
        
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        document.getElementById('order-id').innerText = params.get('orderId') || '---';
        document.getElementById('payment-id').innerText = params.get('paymentId') || '---';
        document.getElementById('ticket-info').innerText = `${params.get('qty') || '1'}x ${params.get('type') || 'Ticket'}`;
        document.getElementById('cust-name').innerText = params.get('name') || 'Guest';
        
        // Update QR Code with Order ID
        const orderId = params.get('orderId');
        if (orderId) {
            document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${orderId}`;
        }
    </script>
</body>
</html>
