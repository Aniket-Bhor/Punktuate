<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punktuate | Reliable Influencer Marketing</title>
    <meta name="description" content="Punktuate is a premium luxury marketing agency specializing in sustainable influencer marketing, creator continuity, and data-driven growth strategies.">
    <meta name="keywords" content="influencer marketing, marketing agency, social media, brand strategy, creator partnerships">
    <meta name="author" content="Punktuate">
    <meta property="og:title" content="Punktuate | Reliable Influencer Marketing">
    <meta property="og:description" content="Premium luxury marketing agency specializing in sustainable influencer marketing.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="17-removebg-preview.png">

    <!-- Tailwind (utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="index.css">
</head>
<body class="pt-0">

    <!-- ═══════════════════════════════════════════════════════
         NOTIFICATION BANNER
    ═══════════════════════════════════════════════════════ -->
    <div id="notification-banner"
         class="fixed top-0 w-full h-[32px] z-[200] bg-[#D4AF37]/90 text-[#000B3D] flex items-center justify-center gap-3 cursor-pointer transition-all hover:bg-white backdrop-blur-md hidden">
        <span class="luxury-caption text-[9px] font-black tracking-[0.15em] animate-pulse">Announcement</span>
        <p class="text-[10px] font-bold uppercase tracking-tight"></p>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
    </div>

    <!-- Background blobs -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] bg-blue-600/10 blur-[180px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-[#D4AF37]/5 blur-[180px] rounded-full"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         NAVBAR
    ═══════════════════════════════════════════════════════ -->
    <nav id="navbar" class="fixed top-[32px] w-full z-[100] transition-all duration-700 px-6 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="cursor-pointer nav-logo-container" onclick="router.navigate('home')">
                <img src="17-removebg-preview.png" alt="Punktuate Logo" class="nav-logo h-8 md:h-10 w-auto">
            </div>
            <div class="flex items-center gap-12">
                <div class="hidden lg:flex gap-4 luxury-caption text-[11px] text-white/80">
                    <button onclick="router.navigate('home')"       class="nav-glass-btn hover:text-white transition-all active-tab" id="link-home">Home</button>
                    <button onclick="router.navigate('about')"      class="nav-glass-btn hover:text-white transition-all" id="link-about">About Us</button>
                    <button onclick="router.navigate('events-hub')" class="nav-glass-btn hover:text-white transition-all" id="link-events-hub">Events</button>
                    <button onclick="router.navigate('services')"   class="nav-glass-btn hover:text-white transition-all" id="link-services">Services</button>
                    <button onclick="router.navigate('journal')"    class="nav-glass-btn hover:text-white transition-all" id="link-journal">Journal</button>
                    <button onclick="router.navigate('jobs')"       class="nav-glass-btn hover:text-white transition-all" id="link-jobs">Careers</button>
                    <button onclick="router.navigate('contact')"    class="nav-glass-btn hover:text-white transition-all" id="link-contact">Contact Us</button>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="router.navigate('contact')" class="hidden sm:block btn-hover bg-white text-[#000B3D] px-8 py-3 rounded-full luxury-caption text-[11px] font-extrabold shadow-lg">Inquiry</button>
                    <button onclick="toggleMobileMenu()" class="lg:hidden w-10 h-10 glass rounded-full flex items-center justify-center text-[#D4AF37] hover:bg-white/10 transition-all">
                        <i data-lucide="menu" id="menu-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ═══════════════════════════════════════════════════════
         MOBILE MENU OVERLAY
    ═══════════════════════════════════════════════════════ -->
    <div id="mobileMenu" class="fixed inset-0 z-[150] bg-[#000B3D]/98 backdrop-blur-2xl lg:hidden flex-col items-center justify-center gap-8 hidden animate-fade-in">
        <button onclick="toggleMobileMenu()" class="absolute top-8 right-8 w-12 h-12 glass rounded-full flex items-center justify-center text-[#D4AF37] hover:bg-white/10 transition-all">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <div class="flex flex-col items-center gap-10 luxury-caption text-white/60">
            <button id="link-mobile-home"       onclick="showPageMobile('home')"       class="nav-link-mobile hover:text-[#D4AF37] transition-all">Home</button>
            <button id="link-mobile-about"      onclick="showPageMobile('about')"      class="nav-link-mobile hover:text-[#D4AF37] transition-all">About Us</button>
            <button id="link-mobile-events-hub" onclick="showPageMobile('events-hub')" class="nav-link-mobile hover:text-[#D4AF37] transition-all">Events</button>
            <button id="link-mobile-services"   onclick="showPageMobile('services')"   class="nav-link-mobile hover:text-[#D4AF37] transition-all">Services</button>
            <button id="link-mobile-journal"    onclick="showPageMobile('journal')"    class="nav-link-mobile hover:text-[#D4AF37] transition-all">Journal</button>
            <button id="link-mobile-jobs"       onclick="showPageMobile('jobs')"       class="nav-link-mobile hover:text-[#D4AF37] transition-all">Careers</button>
            <button id="link-mobile-contact"    onclick="showPageMobile('contact')"    class="nav-link-mobile hover:text-[#D4AF37] transition-all font-extrabold text-[#D4AF37]">Inquiry</button>
        </div>
        <div class="mt-12 flex gap-6">
            <a href="https://www.instagram.com/punktuate.in/" target="_blank" class="social-icon w-12 h-12"><i class="bx bxl-instagram text-2xl"></i></a>
            <a href="https://www.linkedin.com/company/punktuate/" target="_blank" class="social-icon w-12 h-12"><i class="bx bxl-linkedin text-2xl"></i></a>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         MAIN PAGE MOUNT POINT
         All page content is injected here by router.js
    ═══════════════════════════════════════════════════════ -->
    <div class="relative z-10">
        <div id="app" style="transition: opacity 0.2s ease;">
            <!-- Pages load here -->
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         FOOTER
    ═══════════════════════════════════════════════════════ -->
    <footer class="py-32 px-6 text-center bg-[#000B3D]/50 relative z-10">
        <div class="mb-16 flex flex-col items-center">
            <div class="relative group cursor-pointer inline-block" onclick="router.navigate('home')">
                <div class="absolute inset-0 bg-[#D4AF37]/20 blur-2xl rounded-full scale-50 group-hover:scale-110 transition-transform duration-700 opacity-0 group-hover:opacity-100"></div>
                <img src="17-removebg-preview.png" alt="Punktuate Logo" class="relative h-10 w-auto mb-6 hover:scale-110 transition-all duration-700 filter drop-shadow-[0_0_15px_rgba(212,175,55,0.3)]">
            </div>
        </div>
        <div class="flex justify-center gap-6 mb-16 items-center">
            <a href="https://www.instagram.com/punktuate.in/" target="_blank" class="social-icon"><i class="bx bxl-instagram"></i></a>
            <a href="https://www.linkedin.com/company/punktuate/" target="_blank" class="social-icon"><i class="bx bxl-linkedin"></i></a>
            <a href="mailto:aryapawar@punktuate.in" class="social-icon"><i class="bx bx-envelope"></i></a>
        </div>
        <p class="luxury-caption text-[11px] text-white/40 tracking-[0.2em] font-medium">Copyright &copy; 2026 punktuate - All Rights Reserved.</p>
    </footer>

    <!-- ═══════════════════════════════════════════════════════
         GLOBAL OVERLAYS  (modals, booking bar, easter egg)
         These persist across all page navigations.
    ═══════════════════════════════════════════════════════ -->

    <!-- Easter Egg: Konami Code -->
    <div id="konamiOverlay" class="konami-overlay" onclick="closeKonami()">
        <canvas id="warpCanvas" class="absolute inset-0 z-0"></canvas>
        <div class="relative z-10">
            <div class="glitch-text uppercase">Welcome to the <br>Collective.</div>
            <p class="luxury-caption mt-8 text-white/40 tracking-widest">Click anywhere to exit</p>
        </div>
    </div>

    <!-- Founder / Portfolio Modal -->
    <div id="founderModal" class="modal">
        <div class="modal-overlay" onclick="closeFounderModal()"></div>
        <div class="modal-content">
            <div class="p-10 md:p-16">
                <button onclick="closeFounderModal()" class="absolute top-8 right-8 w-12 h-12 glass rounded-full flex items-center justify-center hover:bg-white/10 transition-all">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
                <div id="modalBody"><!-- Injected by JS --></div>
            </div>
        </div>
    </div>

    <!-- Booking Summary floating bar -->
    <div id="booking-flow"
         class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[95%] md:w-[90%] max-w-4xl z-[9999] glass p-6 md:p-12 rounded-[30px] md:rounded-[40px] border-2 border-[#D4AF37] shadow-[0_20px_80px_rgba(0,0,0,0.9)] hidden animate-slide-up"
         style="display:none;">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 md:gap-12">
            <div class="text-left w-full flex-grow">
                <div class="flex justify-between items-start">
                    <div>
                        <h4 id="selected-ticket-name" class="text-xl md:text-3xl font-bold uppercase mb-1">Regular Ticket</h4>
                        <p class="text-white/40 luxury-caption text-[8px] md:text-[10px] mb-4" id="booking-event-label">Punktuate Event</p>
                    </div>
                    <button onclick="closeBookingFlow()" class="md:hidden w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white/40">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="flex items-center gap-4 md:gap-8">
                    <div class="flex items-center gap-2 md:gap-4 bg-white/5 p-1 md:p-2 rounded-full border border-white/10">
                        <button onclick="updateQty(-1)" class="w-8 h-8 md:w-10 md:h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-[#D4AF37] transition-all"><i data-lucide="minus" class="w-3 h-3 md:w-4 md:h-4"></i></button>
                        <span id="ticket-qty" class="text-lg md:text-2xl font-bold w-6 md:w-8 text-center">1</span>
                        <button onclick="updateQty(1)"  class="w-8 h-8 md:w-10 md:h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-[#D4AF37] transition-all"><i data-lucide="plus" class="w-3 h-3 md:w-4 md:h-4"></i></button>
                    </div>
                    <div class="text-xl md:text-3xl font-black text-[#D4AF37]">₹<span id="total-price">1999</span></div>
                </div>
            </div>
            <div class="w-full md:w-auto flex flex-col gap-3">
                <button id="proceed-to-payment-btn" onclick="showRazorpayPage()" class="w-full md:w-auto whitespace-nowrap bg-[#D4AF37] text-[#000B3D] px-8 md:px-12 py-4 md:py-5 rounded-full luxury-caption text-[10px] md:text-[11px] font-black btn-hover flex items-center justify-center gap-4 shadow-xl">
                    Proceed to Payment <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
                <button onclick="closeBookingFlow()" class="hidden md:block text-white/20 hover:text-white/60 text-[9px] luxury-caption uppercase transition-all">Cancel Selection</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         SCRIPTS  (load order matters)
    ═══════════════════════════════════════════════════════ -->
    <!-- 1. Data & defaults (must be first — other modules depend on it) -->
    <script src="js/data.js"></script>

    <!-- 2. Router (must be before nav so showPage shim is available) -->
    <script src="js/router.js"></script>

    <!-- 3. Nav helpers (toggleMobileMenu, showPageMobile, scroll effect) -->
    <script src="js/nav.js"></script>

    <!-- 4. Payment logic -->
    <script src="js/payment.js"></script>

    <!-- 5. Email (EmailJS) -->
    <script src="js/email.js"></script>

    <!-- 6. Content loaders (loadEvents, loadInfluencers, etc.) -->
    <script src="js/content.js"></script>

    <!-- 7. Animations & easter eggs -->
    <script src="js/animations.js"></script>

</body>
</html>
