<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | Punktuate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000B3D; color: white; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .luxury-caption { letter-spacing: 0.4em; text-transform: uppercase; font-weight: 600; font-size: 10px; }
        .text-gold { color: #D4AF37; }
        .btn-hover:hover { background-color: #D4AF37; color: #000B3D; border-color: #D4AF37; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-6 py-20">
    <div class="max-w-2xl w-full text-center">
        <div class="mb-12 inline-block">
            <div class="w-32 h-32 bg-red-500/10 rounded-full flex items-center justify-center border border-red-500/30">
                <i data-lucide="x-circle" class="w-16 h-16 text-red-500"></i>
            </div>
        </div>
        
        <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-6 lowercase">Payment <span class="text-red-500">Failed.</span></h1>
        <p class="text-xl text-white/50 mb-16 max-w-lg mx-auto leading-tight">Something went wrong while processing your payment. Don't worry, your spot is still waiting.</p>
        
        <div class="glass p-12 rounded-[50px] border border-white/10 mb-12">
            <div class="space-y-6">
                <a href="index.html#booking-section" class="block w-full bg-white text-[#000B3D] py-6 rounded-full luxury-caption text-[14px] font-black btn-hover transition-all flex items-center justify-center gap-4">
                    Retry Payment <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </a>
                <a href="mailto:support@punktuate.in" class="block w-full border border-white/10 text-white py-6 rounded-full luxury-caption text-[14px] font-black hover:bg-white/5 transition-all flex items-center justify-center gap-4">
                    Contact Support <i data-lucide="mail" class="w-5 h-5"></i>
                </a>
            </div>
        </div>
        
        <a href="index.html" class="inline-flex items-center gap-3 text-white/40 luxury-caption hover:text-white transition-all">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
